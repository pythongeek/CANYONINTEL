<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodeCanyon Intelligence Asset Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .mobile-container {
            width: 375px;
            height: 812px;
            margin: 0 auto;
            border: 8px solid #111418;
            border-radius: 3rem;
            position: relative;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
<div class="mobile-container bg-background-light dark:bg-background-dark shadow-2xl flex flex-col">
<!-- Header / Close Button Section -->
<header class="flex items-center justify-between px-6 pt-8 pb-2 z-10">
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Details</h2>
<button class="flex items-center justify-center rounded-full w-10 h-10 bg-white/80 dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">close</span>
</button>
</header>
<!-- Main Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto hide-scrollbar pb-32">
<!-- Product Image Section -->
<div class="px-6 py-4">
<div class="w-full h-[150px] bg-center bg-no-repeat bg-cover rounded-xl shadow-md border border-gray-100 dark:border-gray-800" data-alt="Modern abstract software interface dashboard" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA2DU21kiYTSwcDxx7YA_5iH4SpSCPE32OxN2YvWSnxPfAW3dkckCl_k6Nx9RCVwtEu4rIn_SBhwFj_3EfUTeYSkx7JwrIpglAKqdmuTgCvpQWVE2E0J5josoe3UD8FpsEgVGK8JGieZ8Wl_ZvC6-I3wLlRgAjPsB5tM5HoR1heO3qLK_OwATIh3ZBPYBxBG6JDT9LB3irzrDbT8-YB80mqJN7mpHsc6RYb8u1kONcnt3A-2H2Pa3bCZgVie9rQ3LZw-A4JqWode6CK");'>
</div>
</div>
<!-- Title & Category -->
<div class="px-6">
<h1 class="text-[#111418] dark:text-white text-2xl font-bold leading-tight">CodeCanyon Intelligence Asset</h1>
<div class="flex gap-2 mt-2">
<div class="flex h-7 shrink-0 items-center justify-center rounded-lg bg-primary/10 px-3">
<p class="text-primary text-xs font-semibold">SAAS</p>
</div>
<div class="flex h-7 shrink-0 items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800 px-3">
<p class="text-gray-600 dark:text-gray-400 text-xs font-medium">Software</p>
</div>
</div>
</div>
<!-- Profitability Score & Price Section -->
<div class="px-6 pt-8 flex flex-col items-center">
<div class="relative flex items-center justify-center w-32 h-32">
<!-- SVG Circular Progress -->
<svg class="w-full h-full transform -rotate-90">
<circle class="text-gray-200 dark:text-gray-800" cx="64" cy="64" fill="transparent" r="58" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary" cx="64" cy="64" fill="transparent" r="58" stroke="currentColor" stroke-dasharray="364.4" stroke-dashoffset="54.6" stroke-width="8"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="text-3xl font-bold text-[#111418] dark:text-white">85%</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-gray-500">Profit Score</span>
</div>
</div>
<div class="mt-6 text-center">
<p class="text-gray-500 text-sm font-medium">Standard License</p>
<p class="text-primary text-4xl font-bold leading-tight">$49</p>
</div>
</div>
<!-- Vertical Data Cards -->
<div class="px-6 mt-8 space-y-4">
<h3 class="text-[#111418] dark:text-white text-sm font-bold uppercase tracking-wider">Market Performance</h3>
<div class="flex flex-col gap-3">
<!-- Card: Sales -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-xl shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-green-50 dark:bg-green-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-green-600">trending_up</span>
</div>
<div>
<p class="text-gray-500 text-xs font-medium">Monthly Sales</p>
<p class="text-[#111418] dark:text-white font-bold">1,200</p>
</div>
</div>
<div class="text-right">
<p class="text-green-600 text-xs font-bold">+12%</p>
</div>
</div>
<!-- Card: Revenue -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-xl shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-blue-600">payments</span>
</div>
<div>
<p class="text-gray-500 text-xs font-medium">Revenue</p>
<p class="text-[#111418] dark:text-white font-bold">$58.8k/mo</p>
</div>
</div>
</div>
<!-- Card: Competition -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-xl shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-orange-50 dark:bg-orange-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-orange-600">monitoring</span>
</div>
<div>
<p class="text-gray-500 text-xs font-medium">Competition</p>
<p class="text-[#111418] dark:text-white font-bold">Low</p>
</div>
</div>
</div>
</div>
<!-- Input Section -->
<div class="mt-6 space-y-4">
<div class="relative">
<label class="absolute -top-2 left-3 bg-background-light dark:bg-background-dark px-1 text-[10px] font-bold text-gray-500 uppercase">Analysis Period</label>
<select class="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg h-12 px-4 text-sm font-medium text-[#111418] dark:text-white appearance-none">
<option>Last 30 Days</option>
<option>Last 6 Months</option>
<option>Last Year</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-gray-400 pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Action Bar -->
<footer class="absolute bottom-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 p-6 flex gap-3 pb-8">
<button class="flex-1 flex h-12 items-center justify-center rounded-xl border-2 border-primary text-primary font-bold text-sm tracking-wide">
                COMPARE
            </button>
<button class="flex-[2] flex h-12 items-center justify-center rounded-xl bg-primary text-white font-bold text-sm tracking-wide shadow-lg shadow-primary/30">
                ANALYZE ASSET
            </button>
</footer>
<!-- iPhone Notch/Island Simulator -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-7 bg-[#111418] rounded-b-2xl"></div>
</div>
</body></html>
