<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in slide-in-from-right-4 duration-500">
    <div class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 rounded-2xl p-6">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-6 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">trending_up</span>
                Long-term Scaling & Exit
            </h3>
            <div
                class="p-8 text-center text-slate-500 border-2 border-dashed border-slate-100 dark:border-slate-800 rounded-3xl">
                <span class="material-symbols-outlined text-4xl mb-4 text-primary/40">rocket</span>
                <p class="text-sm font-medium">Your roadmap is nearly complete. Review the final AI scaling strategy
                    below.</p>
            </div>
        </div>

        <!-- AI Insights Pulse -->
        {% include "components/planner/ai_insights.html" %}

        <div class="flex justify-between">
            <button hx-get="/planner/{{ product.id }}/step/5" hx-target="#planner-container"
                hx-swap="innerHTML transition:true"
                class="px-6 py-3 text-slate-500 font-bold rounded-xl flex items-center gap-2 hover:bg-slate-100 transition-all">
                <span class="material-symbols-outlined">arrow_back</span>
                Back
            </button>
            <button id="next-btn"
                class="px-10 py-4 bg-success hover:bg-success/90 text-white font-bold rounded-xl shadow-lg shadow-success/20 flex items-center gap-2 transition-all">
                Finalize & Save Project
                <span class="material-symbols-outlined">check_circle</span>
            </button>
        </div>
    </div>
</div>
<script>
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('progress-percent').innerText = '100%';
</script>
