<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in slide-in-from-right-4 duration-500">
    <div class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 rounded-2xl p-6">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-6 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">campaign</span>
                Go-to-Market & Launch Plan
            </h3>
            <div class="space-y-4">
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-800">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Primary
                        Channel</label>
                    <div class="flex flex-wrap gap-2">
                        <span
                            class="px-3 py-1 bg-primary/10 text-primary rounded-full text-[10px] font-bold border border-primary/20">Product
                            Hunt</span>
                        <span
                            class="px-3 py-1 bg-slate-200 dark:bg-slate-700 rounded-full text-[10px] font-bold">Twitter/X
                            Ads</span>
                        <span class="px-3 py-1 bg-slate-200 dark:bg-slate-700 rounded-full text-[10px] font-bold">Indie
                            Hackers</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Insights Pulse -->
        {% include "components/planner/ai_insights.html" %}

        <div class="flex justify-between">
            <button hx-get="/planner/{{ product.id }}/step/4" hx-target="#planner-container"
                hx-swap="innerHTML transition:true"
                class="px-6 py-3 text-slate-500 font-bold rounded-xl flex items-center gap-2 hover:bg-slate-100 transition-all">
                <span class="material-symbols-outlined">arrow_back</span>
                Back
            </button>
            <button id="next-btn" hx-get="/planner/{{ product.id }}/step/6" hx-target="#planner-container"
                hx-swap="innerHTML transition:true"
                class="px-8 py-3 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/20 flex items-center gap-2 transition-all">
                Next: Scaling
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>
    </div>
    <div class="lg:col-span-4">
        <div class="bg-blue-50 dark:bg-blue-900/10 p-6 rounded-2xl border border-blue-100 dark:border-blue-900/20">
            <h4 class="text-xs font-black text-blue-700 dark:text-blue-400 uppercase tracking-widest mb-2">Launch
                Strategy</h4>
            <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-medium">Leverage existing niche
                communities to reduce CAC by 40%.</p>
        </div>
    </div>
</div>
<script>
    document.getElementById('progress-bar').style.width = '90%';
    document.getElementById('progress-percent').innerText = '90%';
</script>
